[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robots-txt-lab"
dynamic = ["version"]
description = "robots.txt parser, tester, linter and differ that follows RFC 9309 and Google's documented behaviour."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["robots.txt", "rfc9309", "seo", "technical-seo", "googlebot", "crawler", "robots-exclusion-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/saizul/robots-txt-lab"
Issues = "https://github.com/saizul/robots-txt-lab/issues"
Changelog = "https://github.com/saizul/robots-txt-lab/blob/main/CHANGELOG.md"

[project.scripts]
robots-txt-lab = "robots_txt_lab.cli:main"

[tool.setuptools.dynamic]
version = { attr = "robots_txt_lab._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robots_txt_lab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "UP006", "UP007", "UP035", "UP045", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
