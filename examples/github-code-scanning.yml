# Copy to .github/workflows/robots-txt-code-scanning.yml in the repository that
# holds your site's robots.txt (here assumed at public/robots.txt). The job
# lints the file and uploads the results to GitHub code scanning, where they
# appear under Security > Code scanning and on pull requests. Issues silenced
# with "# robots-txt-lab: disable=..." comments are uploaded as suppressed.
name: robots.txt code scanning

on:
  push:
    branches: [main]
    paths: [public/robots.txt]
  pull_request:
    paths: [public/robots.txt]

permissions:
  contents: read
  security-events: write

jobs:
  sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/saizul/robots-txt-lab@main"
      - name: Lint to SARIF
        # --fail-on never: let code scanning decide what blocks the merge.
        run: robots-txt-lab lint public/robots.txt --format sarif --fail-on never > robots-txt.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: robots-txt.sarif
          category: robots-txt-lab
